name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify sources
        run: |
          set -eo pipefail
          {
            echo "== swift sources in repo:"
            find LiquidCinema -name '*.swift' | sort
            echo "== swift file count: $(find LiquidCinema -name '*.swift' | wc -l)"
            echo "== git head: $(git rev-parse --short HEAD)"
          } 2>&1 | tee -a build.log

      - name: Generate app icon
        run: |
          set -eo pipefail
          {
            python3 --version
            python3 tools/make_icon.py
            ls -lh LiquidCinema/Resources/Assets.xcassets/AppIcon.appiconset/
          } 2>&1 | tee -a build.log

      - name: Show toolchain
        run: |
          set -eo pipefail
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            sw_vers
          } 2>&1 | tee -a build.log

      - name: Install XcodeGen
        run: |
          set -eo pipefail
          {
            brew install xcodegen
            xcodegen --version
          } 2>&1 | tee -a build.log

      - name: Generate project
        run: |
          set -eo pipefail
          {
            xcodegen generate
            echo "== generated project file: $(ls -1 LiquidCinema.xcodeproj/project.pbxproj)"
            echo "== swift refs in pbxproj: $(grep -oE '[A-Za-z0-9_]+\\.swift' LiquidCinema.xcodeproj/project.pbxproj | sort -u | wc -l)"
            echo "== lightbox refs in pbxproj: $(grep -c 'LightboxView.swift' LiquidCinema.xcodeproj/project.pbxproj || true)"
          } 2>&1 | tee -a build.log

      - name: Resolve packages
        run: |
          set -eo pipefail
          {
            xcodebuild -resolvePackageDependencies \
              -project LiquidCinema.xcodeproj \
              -scheme LiquidCinema
          } 2>&1 | tee -a build.log

      - name: Build (unsigned)
        run: |
          set -eo pipefail
          {
            xcodebuild \
              -project LiquidCinema.xcodeproj \
              -scheme LiquidCinema \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              build
          } 2>&1 | tee -a build.log

      - name: Package IPA
        if: always()
        run: |
          set -eo pipefail
          {
            APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit || true)"
            echo "app: ${APP_PATH}"
            if [ -z "${APP_PATH}" ] || [ ! -f "${APP_PATH}/LiquidCinema" ]; then
              echo "No runnable .app produced - build failed, skipping IPA."
              exit 0
            fi
            rm -rf Payload LiquidCinema-unsigned.ipa
            mkdir -p Payload
            cp -R "${APP_PATH}" Payload/
            zip -qry LiquidCinema-unsigned.ipa Payload
            ls -lh LiquidCinema-unsigned.ipa
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/*.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/*.app/Info.plist || true
          } 2>&1 | tee -a build.log

      - name: Publish build log and IPA
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            shopt -s nullglob
            assets=(build.log)
            if [ -f LiquidCinema-unsigned.ipa ]; then
              assets+=(LiquidCinema-unsigned.ipa)
            fi
            if gh release view build-latest >/dev/null 2>&1; then
              gh release upload build-latest "${assets[@]}" --clobber
            else
              gh release create build-latest \
                --title "LiquidCinema - latest build" \
                --notes "Unsigned IPA for AltStore / Sideloadly, plus the full xcodebuild log." \
                "${assets[@]}"
            fi
          } 2>&1 | tee -a build.log

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidcinema-build
          path: |
            build.log
            LiquidCinema-unsigned.ipa
          if-no-files-found: warn
          retention-days: 30
